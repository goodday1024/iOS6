services:
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
    ports: ['127.0.0.1:8000:8000']
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://retro:${POSTGRES_PASSWORD}@postgres:5432/retro6
      DATA_DIR: /app/data
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: retro6
      REDIS_URL: redis://redis:6379/0
    volumes: [platform:/app/data]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      bucket: {condition: service_completed_successfully}
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")']
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile
    command: ['python', '-m', 'rq.cli', 'worker', '--url', 'redis://redis:6379/0', '--with-scheduler', 'validation']
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://retro:${POSTGRES_PASSWORD}@postgres:5432/retro6
      DATA_DIR: /app/data
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: retro6
    volumes: [platform:/app/data]
    depends_on:
      api: {condition: service_healthy}
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: retro
      POSTGRES_DB: retro6
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U retro -d retro6']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes: [queue:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:8000,http://127.0.0.1:8000
    volumes: [objects:/data]
  bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    entrypoint: ['/bin/sh', '-c']
    command:
      - 'until mc alias set local http://minio:9000 "$S3_ACCESS_KEY" "$S3_SECRET_KEY"; do sleep 1; done; mc mb --ignore-existing local/retro6'
volumes:
  platform:
  database:
  queue:
  objects:
