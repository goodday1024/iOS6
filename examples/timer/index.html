<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus Timer</title><style>body{background:radial-gradient(#506574,#162d3d);color:#eee;text-align:center;font:17px -apple-system,sans-serif;margin:0;padding:30px 15px}h1{font-size:21px;font-weight:500}.dial{margin:40px auto;border:8px solid #bec6c8;border-radius:50%;width:220px;height:220px;display:grid;place-items:center;font:45px Georgia;background:linear-gradient(#182128,#3d515d);box-shadow:inset 0 0 20px #000,0 10px 20px #0005}button,input{font:inherit;border:1px solid #b4c3c9;border-radius:8px;padding:12px;background:linear-gradient(#829ca9,#3b5e6e);color:white}input{width:80px;text-align:center}p{color:#a9bdc8}</style><h1>Focus Timer</h1><p>留一点时间，给专注。</p><div class="dial" id="time">25:00</div><label>分钟 <input id="minutes" type="number" min="1" max="180" value="25"></label><p><button id="start">开始</button> <button id="reset">重置</button></p><p id="count">已完成 0 次</p><script>let left=1500,end=0,running=false,count=0;const time=document.getElementById('time'),start=document.getElementById('start');const display=()=>time.textContent=Math.floor(left/60).toString().padStart(2,'0')+':'+(left%60).toString().padStart(2,'0');start.onclick=()=>{running=!running;if(running)end=Date.now()+left*1000;start.textContent=running?'暂停':'继续'};document.getElementById('reset').onclick=()=>{running=false;left=Math.max(1,Math.min(180,Number(document.getElementById('minutes').value)||25))*60;start.textContent='开始';display()};setInterval(async()=>{if(!running)return;left=Math.max(0,Math.ceil((end-Date.now())/1000));display();if(!left){running=false;count++;document.getElementById('count').textContent='已完成 '+count+' 次';await Simulator.storage.set('count',String(count));await Simulator.ui.alert('本次专注已完成。')}},250);Simulator.storage.get('count').then(v=>{count=Number(v)||0;document.getElementById('count').textContent='已完成 '+count+' 次'});</script></html>
