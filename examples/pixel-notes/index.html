<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Pixel Notes</title><style>*{box-sizing:border-box}body{margin:0;color:#544636;background:#fff4cf;font:17px Georgia,serif}header{padding:20px;background:linear-gradient(#9e8064,#674e38);color:white;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 5px #0003}h1{font-size:22px;margin:0}textarea{display:block;resize:none;width:100%;height:70vh;border:0;padding:20px 20px 20px 36px;background:repeating-linear-gradient(transparent,transparent 31px,#d9c99a 32px);line-height:32px;font:18px/32px Georgia;color:#3c3429;outline:none}button{border:1px solid #5a432c;background:linear-gradient(#b39474,#745337);color:white;border-radius:6px;padding:7px 12px}footer{padding:14px;color:#8f7b59;font-size:13px}</style><header><h1>Pixel Notes</h1><button id="save">保存</button></header><textarea id="note" placeholder="写下你的第一条笔记…" aria-label="笔记"></textarea><footer id="state">本地私有存储 · 自动保存</footer><script>const note=document.getElementById('note'),state=document.getElementById('state');let timer;async function save(){try{await Simulator.storage.set('note',note.value);state.textContent='已保存 · '+new Date().toLocaleTimeString()}catch(e){state.textContent=e.message}}async function load(){try{note.value=await Simulator.storage.get('note')||''}catch(e){state.textContent=e.message}}note.oninput=()=>{clearTimeout(timer);timer=setTimeout(save,250)};document.getElementById('save').onclick=save;load();window.addEventListener('simulator:resume',load);</script></html>
