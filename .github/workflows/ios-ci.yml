name: iOS Build and Unsigned IPA
on: [push, pull_request, workflow_dispatch]
jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: apps/ios-host
      - name: Build and test in iOS Simulator
        working-directory: apps/ios-host
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,vs in d["devices"].items() if "iOS" in k for x in vs if x["name"].startswith("iPhone")))')
          xcodebuild test -project Retro6.xcodeproj -scheme Retro6 -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO
      - name: Build device app
        working-directory: apps/ios-host
        run: xcodebuild -project Retro6.xcodeproj -scheme Retro6 -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath DeviceBuild CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA
        working-directory: apps/ios-host
        run: |
          mkdir Payload
          cp -R DeviceBuild/Build/Products/Release-iphoneos/Retro6.app Payload/
          zip -r Retro6-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Retro6-unsigned-IPA
          path: apps/ios-host/Retro6-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-test-results
          path: apps/ios-host/DerivedData/Logs/Test/*.xcresult
