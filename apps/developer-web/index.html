<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retro6 · Connect</title><link rel="stylesheet" href="style.css"><body><aside><a class="brand" href="#"><span class="brand-icon">6</span> Retro6</a><small>独立的复古应用生态</small><nav><button data-view="overview">◈ 总览</button><button data-view="apps">▦ 我的应用</button><button data-view="store">◎ 应用商店</button><button data-view="beta">✈ Beta 测试</button><button data-view="simulator">▣ 模拟器</button><button data-view="team">♧ 团队</button><button data-view="reviews" class="admin">✓ 审核中心</button><button data-view="audit" class="admin">≡ 审计日志</button></nav><div class="aside-bottom"><span id="account">未登录</span><button id="signout">退出登录</button></div></aside><main><header><div><small>DEVELOPER WORKSPACE</small><h1 id="title">总览</h1></div><span class="pill">自建 Connect / Beta / Store</span></header><div id="content"></div></main><dialog id="auth"><form id="auth-form"><div class="brand-icon">6</div><h2>欢迎来到 Retro6</h2><p>让你的应用，在复古桌面上真正运行。</p><label>邮箱<input name="email" type="email" autocomplete="email" required></label><label>密码<input name="password" type="password" minlength="10" autocomplete="current-password" required></label><label>管理员动态口令（如已启用）<input name="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></label><p id="auth-error" role="alert"></p><div class="row"><button type="submit" class="primary">登录</button><button type="button" id="register">注册账号</button></div><button type="button" id="guest">浏览商店</button><small>独立社区平台，与 Apple 官方服务无关联。</small></form></dialog><dialog id="modal"><div id="modal-body"></div><button id="modal-close">关闭</button></dialog><div id="toast" role="status"></div><script src="app.js"></script></body></html>
